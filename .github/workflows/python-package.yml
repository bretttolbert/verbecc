# This workflow installs Python dependencies, runs tests, and lints across Python versions.
# For details see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.13.7"
        enable-cache: true

    - name: Sync dependencies
      run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

    - name: Lint with ruff
      run: |
        uv run --locked --extra dev ruff check .

    - name: Test with pytest
      run: |
        uv run --locked --extra dev pytest