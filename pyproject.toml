[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "verbecc"
version = "2.1.0"
dependencies = [
  "backports.strenum>=1.3.1,<2.0 ; python_version < '3.11'",
  "cython>=3.0.11",
  "dataclass-wizard[yaml]>=0.39.1",
  "importlib_resources>=6.4.5 ; python_version < '3.13'",
  "jsbeautifier>=1.15.4,<2.0",
  "lxml-stubs>=0.5.1",
  "lxml>=6.0.2",
  "numpy>=1.26.4 ; python_version < '3.10'",
  "numpy>=2.0.2 ; python_version >= '3.10'",
  "pyaml>=25.7.0",
  "scikit-learn>=1.6.1 ; python_version < '3.11'",
  "scikit-learn>=1.7.2 ; python_version >= '3.11'",
  "scipy>=1.13.1 ; python_version < '3.10'",
  "scipy>=1.15.3 ; python_version >= '3.10'",
]
requires-python = ">=3.10"
authors = [{ name = "Brett Tolbert", email = "bretttolbert@gmail.com" }]
maintainers = [{ name = "Brett Tolbert", email = "bretttolbert@gmail.com" }]
description = "Verbs Completely Conjugated: machine learning conjugator for Catalan, French, Italian, Portuguese, Romanian and Spanish"
readme = "README.md"
license = { file = "LICENSE.txt" }
keywords = [
  'català',
  'Catalan',
  'conjugation',
  'conjugator',
  'Education',
  'español',
  'français',
  'French',
  'Italian',
  'italiano',
  'Language Learning',
  'Linguistics',
  'Machine Learning',
  'Natural Language Processing',
  'NLP',
  'português',
  'Portuguese',
  'română',
  'Romanian',
  'Spanish',
  'verb,',
]
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Intended Audience :: Developers',
  'Intended Audience :: Education',
  'Intended Audience :: End Users/Desktop',
  'Intended Audience :: Science/Research',
  'License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)',
  'Natural Language :: Catalan',
  'Natural Language :: French',
  'Natural Language :: Italian',
  'Natural Language :: Portuguese',
  'Natural Language :: Romanian',
  'Natural Language :: Spanish',
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Programming Language :: Python :: 3',
  'Topic :: Education',
  'Topic :: Scientific/Engineering :: Artificial Intelligence',
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Topic :: Text Processing :: Linguistic',
  'Topic :: Utilities',
]

[project.optional-dependencies]
dev = [
  "ruff>=0.1.0",
  "pytest>=9.1.1",
]

[project.urls]
Homepage = "https://github.com/bretttolbert/verbecc"
Documentation = "https://github.com/bretttolbert/verbecc"
Repository = "https://github.com/bretttolbert/verbecc.git"
"Bug Tracker" = "https://github.com/bretttolbert/verbecc/issues"
Changelog = "https://github.com/bretttolbert/verbecc/blob/master/CHANGELOG.md"

[tool.setuptools.package-data]
trained_models = ['verbecc/data/models/*', 'py.typed']

[tool.setuptools.packages.find]
where = ["src"]  # <-- This tells setuptools to scan inside src/

[project.scripts]
train-verb-models = 'verbecc.core.utils.utils:train_models'

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
    "tests"
]
norecursedirs = [
    ".git",
    ".tox",
    "build",
    "dist",
    "venv",
    "docs",
    "__pycache__",
    "verbecc/data",
    "data",
    "doc"
]
addopts = [
    "--ignore=.git",
    "--ignore=.tox",
    "--ignore=build",
    "--ignore=dist",
    "--ignore=__pycache__",
    "--ignore=verbecc/data",
    "--ignore=data",
    "--ignore=doc"
]

[tool.ruff]
# Set the maximum line length to match your GitHub Actions setup
line-length = 127

[tool.ruff.lint]
# Enable Flake8 syntax/error equivalents (E9, F63, F7, F82)
# "E" and "F" enable pycodestyle errors and Pyflakes
select = ["E9", "F63", "F7", "F82"]

# Enable McCabe complexity checking (equivalent to flake8 --max-complexity=10)
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
mypy_path = "typings"

[[tool.mypy.overrides]]
module = "*.pyi"
ignore_errors = true
